name: MIPA Temp Build
on:
  push:
    branches: [mipa-build-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild source
        shell: pwsh
        run: |
          $parts = Get-ChildItem source-chunk-*.txt | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('mipa-source.tar.gz', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path work -Force | Out-Null
          tar -xzf mipa-source.tar.gz -C work
      - name: Apply compile fix
        shell: pwsh
        run: |
          $p = 'work/MultiInstancePokeAI/src/MultiInstancePokeAI.UI/GameDataHubWindow.cs'
          $old = '        var neverSell=new CheckBox{Content="NEVER SELL",Margin=new Thickness(6)},neverTrade=new CheckBox{Content="NEVER TRADE",Margin=new Thickness(6)},neverDelete=new CheckBox{Content="NEVER DELETE",Margin=new Thickness(6)},neverModify=new CheckBox{Content="NEVER MODIFY",Margin=new Thickness(6)};'
          $new = "        var neverSell=new CheckBox{Content=`"NEVER SELL`",Margin=new Thickness(6)};`n        var neverTrade=new CheckBox{Content=`"NEVER TRADE`",Margin=new Thickness(6)};`n        var neverDelete=new CheckBox{Content=`"NEVER DELETE`",Margin=new Thickness(6)};`n        var neverModify=new CheckBox{Content=`"NEVER MODIFY`",Margin=new Thickness(6)};"
          $src = Get-Content $p -Raw
          $src = $src.Replace($old, $new)
          Set-Content -Path $p -Value $src -Encoding utf8
      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish work/MultiInstancePokeAI/src/MultiInstancePokeAI.UI/MultiInstancePokeAI.UI.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath MultiInstancePokeAI-v0.5-Windows-x64.zip -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MultiInstancePokeAI-v0.5-Windows-x64
          path: MultiInstancePokeAI-v0.5-Windows-x64.zip
          if-no-files-found: error
