name: MIPA Temp Build
on:
  push:
    branches: [mipa-build-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          tar -xf mipa-source.zip -C work
      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish work/MultiInstancePokeAI/src/MultiInstancePokeAI.UI/MultiInstancePokeAI.UI.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath MultiInstancePokeAI-v0.5-Windows-x64.zip -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MultiInstancePokeAI-v0.5-Windows-x64
          path: MultiInstancePokeAI-v0.5-Windows-x64.zip
          if-no-files-found: error
